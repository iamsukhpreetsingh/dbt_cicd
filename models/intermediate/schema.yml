version: 2

models:

  - name: int_daily_revenue
    description: >
      Combines ticket revenue and in-park sales revenue by visit date using a
      FULL OUTER JOIN so dates that appear in only one source are still included.
      All NULL sides of the join are coalesced to 0.

      Grain: one row per `visit_date`. Includes all dates that appear in either
      `stg_sales__tickets` or `stg_sales_transactions__sales_transactions`.
    columns:
      - name: visit_date
        description: Calendar date of the park visit.
        data_tests:
          - not_null
          - unique
      - name: ticket_revenue
        description: Sum of ticket `final_price` for the visit date.
      - name: in_park_revenue
        description: Sum of POS `total_amount` for the visit date.
      - name: food_revenue
        description: Portion of in-park revenue where `category = 'food'`.
      - name: merch_revenue
        description: Portion of in-park revenue where `category = 'merchandise'`.
      - name: total_revenue
        description: Combined ticket and in-park revenue for the visit date.
      - name: unique_visitors
        description: Distinct customers with a ticket for the visit date.
      - name: tickets_sold
        description: Total ticket rows for the visit date.


  - name: int_ride_metrics
    description: >
      Ride-level feedback enrichment built from the ride catalog and ride-specific guest
      feedback. One row per `ride_id`.

      This model filters feedback to `category = 'ride'` and `ride_id IS NOT NULL` so the
      downstream ride marts are based only on actual ride feedback. It also carries ride
      attributes that matter for stakeholder analysis, including status, min height, and
      opened date, plus review coverage signals such as `has_reviews` and `review_count_band`.
    columns:
      - name: ride_id
        description: Natural primary key from `stg_park_assets__rides`.
        data_tests:
          - not_null
          - unique
      - name: ride_name
        description: Display name of the ride.
      - name: ride_type
        description: Physical ride category.
      - name: min_height_cm
        description: Minimum rider height requirement in centimetres.
      - name: thrill_level
        description: Operations-assigned thrill intensity.
      - name: zone
        description: Park zone where the ride is located.
      - name: is_haunted
        description: Haunted ride flag.
      - name: status
        description: Current ride operating status.
      - name: opened_date
        description: Date the ride first opened to the public.
      - name: capacity_per_hour
        description: Maximum riders per hour under normal conditions.
      - name: avg_wait_minutes
        description: Rolling average wait time in minutes.
      - name: total_reviews
        description: Count of ride-category feedback rows linked to the ride.
      - name: avg_rating
        description: Average satisfaction rating from ride feedback.
      - name: positive_reviews
        description: Count of positive ride feedback rows.
      - name: neutral_reviews
        description: Count of neutral ride feedback rows.
      - name: negative_reviews
        description: Count of negative ride feedback rows.
      - name: positive_review_pct
        description: Percentage of ride feedback rows classified as positive.
      - name: has_reviews
        description: TRUE when the ride has at least one ride feedback row.
      - name: review_count_band
        description: Review volume band for the ride.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Reviews', 'Single Review', 'Low Volume', 'Established']


  - name: int_customer_visits
    description: >
      Customer visit-level enrichment built from ticket purchases, matched POS spend,
      and matched visitor feedback.

      Grain: one row per `ticket_id`.

      POS spend and feedback are matched on `(customer_id, visit_date)`. When no
      matching POS transaction exists, `in_park_spend` is set to 0. When no matching
      feedback exists, `avg_rating` remains NULL and `has_feedback` is FALSE.

      This intermediate model centralizes reusable visit behavior fields so downstream
      customer marts do not need to re-derive booking lead time, discount usage, or
      feedback participation.
    columns:
      - name: ticket_id
        description: Visit-level primary key sourced from `stg_sales__tickets`.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer identifier for the visit.
        data_tests:
          - not_null
      - name: visit_date
        description: Date of the park visit.
        data_tests:
          - not_null
      - name: ticket_type
        description: Ticket product type used for the visit.
      - name: purchase_date
        description: Date the ticket was purchased.
      - name: purchase_channel
        description: Ticket purchase channel for the visit.
      - name: is_discounted
        description: TRUE when the ticket had a non-zero discount amount.
      - name: ticket_price
        description: Ticket revenue attributed to the visit.
      - name: in_park_spend
        description: POS spend matched to the customer and visit date.
      - name: total_visit_spend
        description: "Combined visit spend: `ticket_price + in_park_spend`."

      - name: booking_lead_days
        description: Days between ticket purchase and visit date.
      - name: is_same_day_visit
        description: TRUE when the ticket was purchased on the visit date.
      - name: is_advance_purchase
        description: TRUE when the ticket was purchased at least 7 days before the visit.
      - name: avg_rating
        description: Average matched visitor rating for the visit. NULL means no feedback.
      - name: feedback_count
        description: Number of matched feedback submissions for the visit.
      - name: has_feedback
        description: TRUE when at least one matched feedback row exists for the visit.
