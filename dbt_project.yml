# Name your project! Project names should contain only lowercase characters
# and underscores. A good package is named after the intended use case.
name: 'dbt_practice'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_practice'

# These configurations specify where dbt should look for different types of files.
model-paths: [ "models" ]
analysis-paths: [ "analyses" ]
test-paths: [ "tests" ]
seed-paths: [ "seeds" ]
macro-paths: [ "macros" ]
snapshot-paths: [ "snapshots" ]

clean-targets:
- "target"
- "dbt_packages"
#dbt-cloud:
# Opt in to dbt Cloud deferral only when a real environment ID is provided.
# This avoids Fusion implicitly probing Cloud for a missing default deferral environment.
#defer-env-id: "{{ env_var('DBT_CLOUD_DEFER_ENV_ID', '') }}"

on-run-start:
- "ALTER SESSION SET QUERY_TAG = 'dbt_run_{{ invocation_id }}'"
- "{{ safe_create_target_schema('INTERMEDIATE') }}"

on-run-end:
- "ALTER SESSION SET QUERY_TAG = ''"

vars:
  date_spine_start: '2020-01-01'
  date_spine_end: '2026-12-31'
  
  bi_role: 'SYSADMIN'

seeds:
  dbt_project_evaluator:
    +enabled: false

  dbt_practice:
    +schema: raw
    +quote_columns: false
    raw_customers:
      +column_types:
        customer_id: varchar
        membership_type: varchar
        signup_channel: varchar
    raw_rides:
      +column_types:
        ride_id: varchar
        ride_type: varchar
        thrill_level: varchar
        zone: varchar
        status: varchar
    raw_tickets:
      +column_types:
        ticket_id: varchar
        customer_id: varchar
        ticket_type: varchar
        purchase_channel: varchar
        promo_code: varchar
    raw_feedback:
      +column_types:
        feedback_id: varchar
        customer_id: varchar
        ride_id: varchar
        category: varchar
        sentiment: varchar
    raw_sales_transactions:
      +column_types:
        transaction_id: varchar
        customer_id: varchar
        category: varchar
        item_name: varchar
        payment_method: varchar
        location: varchar
    raw_employees:
      +column_types:
        employee_id: varchar
        manager_id: varchar
        department: varchar
        role: varchar
        zone_assignment: varchar
    raw_haunted_events:
      +column_types:
        event_id: varchar
        event_name: varchar
        event_type: varchar
        external_partner: varchar
        description: varchar

snapshots:
  dbt_practice:
    +target_schema: snapshots

models:
  dbt_practice:

    +query_tag: 'query_from_dbt'

    staging:
      +materialized: view
      +schema: staging
      +tags: [ 'staging' ]

      customer_data:
        +tags: [ 'customer_data' ]
      park_assets:
        +tags: [ 'park_assets' ]
      sales:
        +tags: [ 'sales' ]
      external_haunted:
        +tags: [ 'external_haunted' ]
      feedback:
        +tags: [ 'feedback' ]

    intermediate:
      +materialized: table
      +schema: intermediate
      +tags: [ 'intermediate' ]

    marts:
      +materialized: table
      +schema: marts
      +tags: [ 'marts' ]

      core:
        +tags: [ 'core' ]
      analytics:
        +tags: [ 'analytics' ]

    utilities:
      +materialized: table
      +schema: utilities
      +tags: [ 'utilities' ]

  dbt_project_evaluator:
    +enabled: false

