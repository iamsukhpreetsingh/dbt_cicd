name: "01 - CI Checks (PR)"

# Diagram steps 2-3: "Open a Pull Request" -> "CI Kicks In (Automated dbt Checks)"
# Runs on every PR touching the dbt project. Uses the "dev" GitHub Environment
# so it gets dev-scoped Snowflake creds — cheapest/least-privileged account.

on:
  pull_request:
    branches: [main]
    paths:
      - "models/**"
      - "macros/**"
      - "seeds/**"
      - "snapshots/**"
      - "tests/**"
      - "dbt_project.yml"
      - "packages.yml"
      - "profiles/**"
      - ".github/workflows/01-ci-checks.yml"

concurrency:
  group: ci-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dbt-ci-checks:
    name: dbt deps / compile / lint / unit tests
    runs-on: ubuntu-latest
    environment: dev            # <-- pulls dev-scoped vars/secrets
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/profiles
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      DBT_THREADS: ${{ vars.DBT_THREADS || '4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for state:modified+ selectors later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.8.* sqlfluff sqlfluff-templater-dbt

      - name: dbt deps
        run: dbt deps

      - name: dbt debug (connection check)
        run: dbt debug

      - name: dbt parse (compile validation)
        run: dbt parse

      - name: SQL lint (sqlfluff)
        run: sqlfluff lint models --dialect snowflake --templater dbt
        continue-on-error: true   # flip to false once your team's lint rules are stable

      - name: dbt build (unit tests / seeds only, no PR schema yet)
        run: dbt build --select "test_type:unit" --exclude "resource_type:model"
        continue-on-error: true   # remove once you've added unit tests; harmless no-op otherwise

      - name: Post CI summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}" === "success" ? "✅ passed" : "❌ failed";
            const body = `**CI Checks (deps / compile / lint):** ${status}\n\nWorkflow: \`01-ci-checks.yml\` run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
