name: "05 - Post-Deploy Observability"

# Diagram step 8: "Post-Deploy Observability & Alerts"
# Chained off workflow 04. Inspects run_results.json for test failures /
# job failures, notifies Slack, and optionally opens an incident issue.

on:
  workflow_run:
    workflows: ["04 - Deploy to Production"]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      AUTO_CREATE_INCIDENT: ${{ vars.AUTO_CREATE_INCIDENT || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prod build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dbt-prod-artifacts
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate run_results.json
        id: check
        run: |
          python3 - <<'PYEOF'
          import json, os

          conclusion = os.environ.get("WORKFLOW_CONCLUSION", "unknown")
          try:
              with open("artifacts/run_results.json") as f:
                  results = json.load(f)
              failures = [r for r in results.get("results", []) if r.get("status") in ("error", "fail")]
          except FileNotFoundError:
              failures = []

          summary = f"{len(failures)} failing node(s)" if failures else "no failures detected"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"failure_count={len(failures)}\n")
              out.write(f"summary={summary}\n")
          PYEOF
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ github.event.workflow_run.conclusion }}"
          ICON="✅"
          if [ "$STATUS" != "success" ] || [ "${{ steps.check.outputs.failure_count }}" != "0" ]; then
            ICON="🚨"
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$ICON Production dbt deploy: $STATUS — ${{ steps.check.outputs.summary }}. <${{ github.event.workflow_run.html_url }}|View run>\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Open incident issue on failure
        if: >
          env.AUTO_CREATE_INCIDENT == 'true' &&
          (github.event.workflow_run.conclusion != 'success' || steps.check.outputs.failure_count != '0')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Prod dbt run failure — ${new Date().toISOString().slice(0,10)}`,
              body: `Production deploy run [#${context.payload.workflow_run.id}](${context.payload.workflow_run.html_url}) finished with conclusion \`${context.payload.workflow_run.conclusion}\`.\n\nFailing nodes: ${{ steps.check.outputs.failure_count }}\n\nTrack: run time, freshness, row-count anomalies.`,
              labels: ["incident", "dbt", "production"]
            });

# Suggested things to track over time (row-count anomalies, freshness drift,
# run-time spikes) live better in a dedicated monitoring tool (Elementary,
# dbt Cloud's own observability, or a Snowflake-native dashboard) than in
# this workflow — this job is the "fire the alert fast" layer, not the
# long-term trend store. See SETUP_GUIDE.md for options.
