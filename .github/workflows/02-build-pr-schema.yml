name: "02 - Build in PR Schema"

# Diagram step 4: "Build in a Temporary / PR Schema"
# Depends on workflow 01 finishing successfully (workflow_run chaining).
# Creates a one-off schema like PR_123_JDOE and runs a full dbt build there
# so nothing touches shared dev/staging tables.

on:
  workflow_run:
    workflows: ["01 - CI Checks (PR)"]
    types: [completed]

concurrency:
  group: pr-schema-build-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read     # needed to read the triggering workflow_run's context

jobs:
  build-pr-schema:
    name: dbt build (ephemeral PR schema)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/profiles
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      DBT_THREADS: ${{ vars.DBT_THREADS || '4' }}

    steps:
      - name: Resolve PR number and head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            // Only reliable for same-repo PRs (not forks) — see setup notes.
            const runs = context.payload.workflow_run;
            const pr = runs.pull_requests[0];
            if (!pr) {
              core.setFailed("Could not resolve PR from workflow_run payload. Fork PRs need the pull_request_target pattern documented in SETUP_GUIDE.md.");
              return;
            }
            core.setOutput("number", pr.number);
            core.setOutput("sha", runs.head_sha);

      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.8.*

      - name: dbt deps
        run: dbt deps

      - name: Compute PR schema name
        id: schema
        run: |
          RAW="PR_${{ steps.pr.outputs.number }}_${GITHUB_ACTOR}"
          CLEAN=$(echo "$RAW" | tr '[:lower:]-' '[:upper:]_' | tr -cd '[:alnum:]_')
          echo "schema=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: dbt build (full build, isolated schema)
        env:
          DBT_PR_SCHEMA: ${{ steps.schema.outputs.schema }}
        run: dbt build --target ci --full-refresh

      - name: Comment schema + build status on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}" === "success" ? "✅ built" : "❌ build failed";
            const schema = "${{ steps.schema.outputs.schema }}";
            const body = `**PR Schema Build:** ${status}\n\nModels + tests were run into \`${schema}\` in the dev database so you can query them directly to sanity-check before merge.\n\nRun: [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            github.rest.issues.createComment({
              issue_number: ${{ steps.pr.outputs.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
