name: "03 - Deploy to QA / Staging"

# Diagram step 5: "Deploy to QA / Staging Environment"
# Depends on workflow 02 (PR schema build) succeeding. Runs the same
# selection against the shared staging schema with near-production
# conditions, plus heavier validation (row counts, freshness, joins).

on:
  workflow_run:
    workflows: [ "02 - Build in PR Schema" ]
    types: [ completed ]

concurrency:
  group: deploy-staging-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write # needed to push the dbt-staging-state branch

jobs:
  deploy-staging:
    name: dbt build + validate (staging)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging # <-- staging-scoped vars/secrets
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/profiles
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      DBT_THREADS: ${{ vars.DBT_THREADS || '4' }}

    steps:
    # Resolve the PR by querying the API for the head branch instead of
    # trusting workflow_run.pull_requests[0], which GitHub frequently
    # returns empty due to indexing lag right after the upstream workflow
    # completes (see: https://github.com/orgs/community/discussions/25220
    # and similar reports). head_branch / head_sha on workflow_run itself
    # are always reliably populated, so we look the PR up from those.
    #
    # workflow_run fires for EVERY completed run of "02", including runs
    # that happen on main (e.g. workflow 02 re-running as a side effect of
    # a merge). Those runs have no open PR by definition — that's not a
    # failure, it's a signal to skip the PR-only parts quietly, not error.
    - name: Resolve PR + head SHA
      id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const branch = context.payload.workflow_run.head_branch;
          const sha = context.payload.workflow_run.head_sha;

          const { data: prs } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head: `${context.repo.owner}:${branch}`,
            state: "open",
          });

          if (prs.length > 0) {
            core.notice(`PR deploy: ${prs[0].number} (${branch})`);
            core.setOutput("is_pr", "true");
            core.setOutput("number", prs[0].number);
            core.setOutput("sha", sha);
          } else {
            core.notice(`Post-merge deploy: ${branch} at ${sha}`);
            core.setOutput("is_pr", "false");
            core.setOutput("sha", sha);
          }

    - name: Checkout PR head commit
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.pr.outputs.sha }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dbt
      run: |
        python -m pip install --upgrade pip
        pip install dbt-snowflake==1.8.*

    - name: dbt deps
      run: dbt deps

    - name: Checkout previous staging manifest (state branch)
      run: |
        git fetch origin dbt-staging-state:dbt-staging-state 2>/dev/null || true
        mkdir -p prod-manifest

        if git show dbt-staging-state:manifest.json > prod-manifest/manifest.json.tmp 2>/dev/null; then
          mv prod-manifest/manifest.json.tmp prod-manifest/manifest.json
          echo "Found prior staging manifest — will build incrementally."
        else
          rm -f prod-manifest/manifest.json.tmp
          echo "No prior staging manifest found — will do a full build."
        fi

    # =============================================================================
    # INCREMENTAL BUILD LIKE PRODUCTION - uses staging-specific state branch
    # =============================================================================
    - name: Build model selector (same logic as production, separate staging state)
      id: selector
      run: |
        # Use -s (non-empty) instead of -f (exists) to ensure manifest is valid
        if [ -s prod-manifest/manifest.json ]; then
          BASE="--select state:modified+ --defer --state prod-manifest"
        else
          BASE=""
        fi
        echo "select=$BASE" >> "$GITHUB_OUTPUT"

    - name: dbt build to staging (incremental like production)
      run: |
        echo "Running incremental dbt build to staging..."
        dbt build --target ci ${{ steps.selector.outputs.select }}
        echo "Staging build completed"

    - name: Save new manifest as staging state baseline
      if: success()
      run: |
        cp target/manifest.json ./manifest.json
        git config user.name "dbt-cicd-bot"
        git config user.email "dbt-cicd-bot@users.noreply.github.com"
        git checkout -B dbt-staging-state
        git add manifest.json
        git commit -m "chore: update staging manifest state [skip ci]" || echo "No changes to commit"
        git push origin dbt-staging-state --force

    - name: Save build outputs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dbt-staging-artifacts
        path: |
          target/manifest.json
          target/run_results.json
        retention-days: 7

    - name: dbt test (freshness, accepted values, relationships)
      run: dbt test --target ci --select "tag:heavy_validation" || true
      # Currently a no-op warning ("does not match any enabled nodes") until
      # you tag freshness/accepted_values/relationships tests with
      # `heavy_validation` in schema.yml — see the convention noted in
      # 03's original comments.

      # NOTE on the previous version of this step: interpolating step outputs
      # directly into the script body (`${{ steps.pr.outputs.number }}`) is
      # unsafe when that output is unset — GitHub substitutes empty string at
      # the YAML level BEFORE the JS is parsed, so `if (${{ ... }})` silently
      # became `if ()`, a JS syntax error, on any post-merge (non-PR) run.
      # Fix: pass values through `env:` instead. Env vars are always valid
      # strings (even "" when unset), so we can check them safely inside JS.
    - name: Report staging validation status
      if: always()
      uses: actions/github-script@v7
      env:
        IS_PR: ${{ steps.pr.outputs.is_pr }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        JOB_STATUS: ${{ job.status }}
      with:
        script: |
          const isPR = process.env.IS_PR === "true";
          const prNumber = process.env.PR_NUMBER;
          const status = process.env.JOB_STATUS === "success" ? "✅ deployed to staging" : "❌ staging deployment failed";

          let body = `**Staging Deploy:** ${status}\n\nRun: [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
          if (isPR) {
            body += `\n\nThis PR is ready for reviewer sign-off once this check is green.`;
          }

          if (prNumber) {
            github.rest.issues.createComment({
              issue_number: Number(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
          }
