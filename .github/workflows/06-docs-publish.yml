name: "06 - Publish dbt Docs"

# Diagram step 9: "Documentation Publish (Optional but Powerful)"
# Chained off workflow 04. Generates dbt docs (incl. lineage graph) and
# publishes to GitHub Pages so the whole team sees updated docs instantly.

on:
  workflow_run:
    workflows: ["04 - Deploy to Production"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      DBT_TARGET: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/profiles
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.8.*

      - name: dbt deps
        run: dbt deps

      - name: dbt docs generate
        run: dbt docs generate --target ci

      - name: Prepare Pages payload
        run: |
          mkdir -p public
          cp -r target/* public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Alternative: if you're already on dbt Cloud or a hosted-docs product,
# swap the last three steps for `dbt Cloud API` doc generation, or push
# `public/` to an S3 bucket / hosted-docs.dbt.cloud site instead.
